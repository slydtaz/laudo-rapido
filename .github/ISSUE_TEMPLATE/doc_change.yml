name: Alterar documentação
description: Sugira uma correção ou acréscimo na documentação de laudo-rapido
title: "[docs]: "
labels: ["documentation"]
body:
  - type: dropdown
    id: file
    attributes:
      label: Arquivo
      options:
        - README.md
        - docs/WIKI.md
        - docs/ARCHITECTURE.md
        - docs/DEPLOY_HISTORY.md
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Mudança proposta
    validations:
      required: true
